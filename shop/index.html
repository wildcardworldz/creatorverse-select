<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreatorVerse Shop</title>
<meta name="description" content="Explore CreatorVerse Shop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23191b20'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='34' fill='%23dfff80'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#f5f7fb;--muted:#9297a3;--paper:#000;--surface:#0a0c10;--line:#222b36;--blue:#a9d6ff}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
.shop{max-width:490px;margin:36px auto;background:#000;padding:30px 26px 26px;border:1px solid #151922;border-radius:28px;box-shadow:0 22px 90px #000}
.profile{text-align:center}
.profile .avatar{width:112px;height:102px;margin:0 auto 16px;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.profile .avatar img{display:block;width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 0 9px #9ed1ff5c)}
.wordmark{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:1.7px;border-bottom:1px solid var(--line);padding-bottom:20px}
.wordmark span{font-weight:400;color:#a9aeb8}
.avatar{position:relative;width:86px;height:86px;margin:30px auto 20px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#191d26,#08090c);border:1px solid #303641;color:white;font-weight:800;font-size:30px;letter-spacing:-2px;box-shadow:0 16px 40px #000,0 0 25px #6e9fff26}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--blue);margin:0 0 8px}
h1{font-size:30px;line-height:1.15;letter-spacing:-1.3px;margin:0 0 10px}
.bio{color:var(--muted);font-size:16px;max-width:290px;margin:0 auto}
#socials:empty{display:none}
#socials{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.social{color:var(--ink);font-size:14px;text-underline-offset:4px}
.section-label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1.6px;font-weight:700;margin:32px 2px 13px;color:#c8cbd2}
.profile + .section-label{margin-top:28px}
.section-label span:last-child{font-size:16px}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;background:linear-gradient(155deg,#12151b,#0b0d11);box-shadow:inset 0 1px #ffffff08}
.featured{background:radial-gradient(ellipse at 50% 115%,#183852 0%,#101923 36%,#0b0d11 72%);color:white;padding:24px;position:relative;border-color:#2b4d68;box-shadow:inset 0 -2px #b8ddff,0 10px 36px #00000070,0 15px 32px #8bc8ff1f}
.feature-top{font-size:12px;color:var(--blue);letter-spacing:1.8px;margin-bottom:35px}
.featured h2{font-size:36px;line-height:1.06;letter-spacing:-1.4px;max-width:320px;margin:9px 0 14px}
.category{font-size:12px;letter-spacing:1.4px;font-weight:700;margin:0;color:#8d93a0}
.featured .category{color:#a6aab3}
.description{font-size:14px;line-height:1.55;color:var(--muted);margin:8px 0 0}
.featured .description{color:#c7cad1;max-width:310px;font-size:16px}
.action{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:13px 17px;font-size:14px;font-weight:700;text-decoration:none;color:#071018;background:linear-gradient(180deg,#bfe3ff,#91c7f4);box-shadow:inset 0 1px #eef8ff,0 -8px 24px #8ccaff42}
.action span{font-size:12px;font-weight:400;color:#101b2d}
.featured .action{border:0;background:linear-gradient(180deg,#c7e8ff,#96cdf6);border-radius:9px;margin-top:24px;padding:14px 16px;box-shadow:inset 0 1px #f3faff,0 0 24px #8fcfff4f;color:#071018}
.featured .action span{color:#10253a}
.compact{display:grid;grid-template-columns:66px 1fr;gap:0 14px;padding-top:18px;box-shadow:inset 0 1px #ffffff08,0 10px 28px #00000028}
.tile{height:66px;width:66px;border-radius:12px;display:grid;place-items:center;font-size:32px;margin-left:17px;color:#eaf6ff;background:linear-gradient(145deg,#1a2c40,#0a121b);border:1px solid #416b8f;box-shadow:inset 0 0 18px #a9d6ff1f,0 0 18px #8bc8ff24}
.compact .card-body{padding:0 16px 18px 16px}
.compact h2{font-size:18px;line-height:1.25;letter-spacing:-.4px;margin:5px 0}
.compact .category{font-size:12px;letter-spacing:1px}
.compact .description{margin:5px 0 0}
.compact .action{grid-column:1/-1}
.circular-action .tile{font-size:36px;line-height:1;text-align:center}
.circular-action .action{justify-content:center;margin:0 14px 14px;padding:14px 17px;border:1px solid #bfe3ff;border-radius:999px;background:linear-gradient(180deg,#c7e8ff,#96cdf6);box-shadow:inset 0 1px #f3faff,0 0 20px #8fcfff40;color:#071018;text-align:center}
.video-card{display:block;padding:0;overflow:hidden;border-color:#2b4d68;box-shadow:inset 0 1px #ffffff08,0 12px 32px #0000002e}
.video-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0a1018}
.video-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.video-card .card-body{padding:19px 18px 13px}
.video-card h2{font-size:23px;line-height:1.15;letter-spacing:-.65px;margin:5px 0}
.video-card .description{font-size:15px;margin-top:7px}
.video-card .action{justify-content:center;margin:3px 14px 15px;padding:16px 18px;border:1px solid #bfe3ff;border-radius:999px;background:linear-gradient(180deg,#c7e8ff,#96cdf6);box-shadow:inset 0 1px #f3faff,0 0 22px #8fcfff45;color:#071018;text-align:center;font-size:15px}
.compact:nth-child(3) .action,.compact:nth-child(4) .action{background:linear-gradient(180deg,#bfe3ff,#91c7f4);box-shadow:inset 0 1px #eef8ff,0 -8px 24px #8ccaff42;color:#071018}
.compact:nth-child(3) .action span,.compact:nth-child(4) .action span{color:#10253a}
.inactive{cursor:default}
.inactive span{opacity:.72}
a.action:hover{filter:brightness(1.1)}
a:focus-visible{outline:3px solid white;outline-offset:4px}
footer{text-align:center;margin-top:30px}
footer p{font-size:12px;margin:4px 0;color:var(--muted)}
footer small{font-size:12px;color:#737985}
@media(max-width:540px){body{background:var(--paper)}
.shop{border:0;border-radius:0;margin:0 auto;padding:24px 21px;box-shadow:none;min-height:100vh}
}
@media(max-width:350px){.shop{padding:22px 14px}
.featured h2{font-size:31px}
.compact{grid-template-columns:52px 1fr;gap:0 10px}
.tile{width:52px;height:60px;margin-left:12px;font-size:27px}
.compact h2{font-size:17px}
}
@media(prefers-reduced-motion:no-preference){a.action{transition:filter .15s,transform .15s}
a.action:hover{transform:translateY(-1px)}
}

</style>

</script><script>
const config = window.SHOP;
document.getElementById('shop-name').textContent = config.name;
document.title = config.name;
const bio = document.getElementById('shop-bio');
if (bio) bio.textContent = config.bio;
const element = (tag, cls, text) => { const e = document.createElement(tag); e.className = cls; if (text) e.textContent = text; return e; };
const safeUrl = value => { try { const u = new URL(value); return ['https:', 'http:', 'mailto:'].includes(u.protocol) ? u.href : null; } catch { return null; } };
for (const social of config.socials) { const url = safeUrl(social.url); if (!url) continue; const a = element('a','social',social.name); a.href = url; document.getElementById('socials').append(a); }
for (const offer of config.offers) {
 const card = element('article', offer.featured ? 'card featured' : offer.video ? 'card video-card' : 'card compact');
 if (offer.circularAction) card.classList.add('circular-action');
 const visual = element('div', 'tile', offer.mark); visual.setAttribute('aria-hidden','true');
 const body = element('div','card-body');
 if (offer.category) body.append(element('p','category',offer.category));
 body.append(element('h2','',offer.title),element('p','description',offer.description));
 const url = safeUrl(offer.url);
 const active = url && !offer.sample;
 const action = element(active ? 'a' : 'div', 'action' + (active ? '' : ' inactive'), active ? offer.label : (offer.sampleButton || 'Coming soon'));
 if (active) action.href = url;
 const actionMeta = offer.hideActionIcon ? '' : (offer.actionIcon || (active ? '\u2197' : 'Sample offer'));
 if (actionMeta) action.append(element('span','',actionMeta));
 if (offer.featured) { card.append(element('div','feature-top','CREATORVERSE / VOL. 01'),body,action); }
 else if (offer.video) {
  const thumb = element('div','video-thumb');
  const image = document.createElement('img'); image.src = offer.image; image.alt = offer.title + ' workshop preview';
  thumb.append(image);
  card.append(thumb,body,action);
 }
 else {
  card.append(visual,body,action);
 }
 document.getElementById('offers').append(card);
}
document.getElementById('draft-note').hidden = !config.offers.some(o => o.sample);

</script>
